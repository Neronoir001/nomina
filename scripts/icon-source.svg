<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="fond" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#2c2124"/>
      <stop offset="1" stop-color="#0d090a"/>
    </radialGradient>
    <linearGradient id="lettre" x1="150" y1="0" x2="362" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbf1cf"/>
      <stop offset="0.48" stop-color="#e9cf86"/>
      <stop offset="0.52" stop-color="#c3312a"/>
      <stop offset="1" stop-color="#7d1414"/>
    </linearGradient>
    <linearGradient id="corne" x1="300" y1="205" x2="378" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7d1414"/>
      <stop offset="1" stop-color="#e2563f"/>
    </linearGradient>
    <filter id="halo-lueur" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="6" result="flou"/>
      <feMerge><feMergeNode in="flou"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect id="fond-forme" width="512" height="512" fill="url(#fond)"/>
  <!-- Auréole au-dessus de la branche céleste -->
  <ellipse cx="180" cy="166" rx="44" ry="13" fill="none" stroke="#f6d878" stroke-width="10" filter="url(#halo-lueur)"/>
  <!-- Corne sur la branche infernale -->
  <path d="M314 204 C306 160 334 126 386 106 C362 140 352 172 342 204 Z" fill="url(#corne)"/>
  <!-- La lettre N, mi-céleste mi-infernale -->
  <g fill="url(#lettre)">
    <rect x="170" y="200" width="28" height="192"/>
    <rect x="314" y="200" width="28" height="192"/>
    <polygon points="170,200 212,200 342,392 300,392"/>
    <rect x="150" y="200" width="62" height="14"/>
    <rect x="150" y="378" width="68" height="14"/>
    <rect x="294" y="200" width="68" height="14"/>
  </g>
</svg>
